# KratosOS: random MAC on every scan and every connection, no leaky defaults.
[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
# Don't send our hostname in DHCP requests
ipv4.dhcp-send-hostname=false
# DHCP identity (finding 23): a randomized MAC alone is not enough — a stable
# DHCP client-id (NM's default is a persistent machine-id-derived DUID) would
# re-link us across MAC changes. Tie the client-id to the (randomized) MAC so
# it rotates with it (no FQDN is sent: dhcp-send-hostname=false above). IPv6 is
# disabled at the kernel, but set privacy DUID/addressing too in case it is
# ever turned on. NOTE: NetworkManager only honours a fixed set of properties
# here (NetworkManager.conf(5), "Connection Section") and logs "unknown key"
# for anything else, so don't put e.g. ipv4.ignore-auto-dns in this section.
ipv4.dhcp-client-id=mac
ipv6.dhcp-duid=ll
ipv6.ip6-privacy=2
connection.mdns=0
connection.llmnr=0

[main]
hostname-mode=none
# DNS: never hand the network's DHCP/RA-advertised resolver to the system
# resolver. systemd-resolved (resolved.conf.d/kratos-privacy.conf) is set for
# Quad9 over AUTHENTICATED DoT (9.9.9.9#dns.quad9.net), but whenever resolved
# runs NetworkManager pushes each connection's DHCP DNS to it as PER-LINK DNS
# with DefaultRoute, so lookups also go to the network's own resolver. (The old
# per-connection "ipv4.ignore-auto-dns=true" default here was silently ignored
# by NM - "unknown key" - VM install test: ens3 had DNS 10.0.2.3 from DHCP.)
# dns=none + systemd-resolved=false stops NM pushing any DNS; resolved then uses
# only the global Quad9 DoT servers. VPN mode sets the tunnel's DNS on the
# WireGuard link itself (kratos net.sh, resolvectl), so it is unaffected.
# Trade-off: a captive portal that hands out its own DNS won't resolve.
dns=none
systemd-resolved=false

[connectivity]
# Connectivity checks contact a fixed server and reveal the OS
enabled=false
