# KratosOS: random MAC on every scan and every connection, no leaky defaults.
[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
# Don't send our hostname in DHCP requests
ipv4.dhcp-send-hostname=false
# DHCP identity (finding 23): a randomized MAC alone is not enough — a stable
# DHCP client-id (NM's default is a persistent machine-id-derived DUID) would
# re-link us across MAC changes. Tie the client-id to the (randomized) MAC so
# it rotates with it, and don't send an FQDN. IPv6 is disabled at the kernel,
# but set privacy DUID/addressing too in case it is ever turned on.
ipv4.dhcp-client-id=mac
ipv4.dhcp-fqdn=
ipv6.dhcp-duid=ll
ipv6.ip6-privacy=2
# DNS: ignore whatever resolver the network's DHCP/RA advertises. The system
# resolver (systemd-resolved; see resolved.conf.d/kratos-privacy.conf) is
# configured for Quad9 over AUTHENTICATED DoT (9.9.9.9#dns.quad9.net). Without
# this, NetworkManager installs the DHCP-provided servers as PER-LINK DNS, and
# systemd-resolved prefers a link's own servers over the global config — so
# every lookup silently goes to the network's resolver (often a bare IP with no
# DoT cert name to verify) instead of Quad9. Ignoring auto DNS makes resolved
# fall back to the global Quad9 + authenticated-DoT config on the default-route
# link. Trade-off: a captive portal that hands out its own DNS won't resolve
# until you reach it; acceptable for a privacy-first default (use VPN/offline
# modes as needed).
ipv4.ignore-auto-dns=true
ipv6.ignore-auto-dns=true
connection.mdns=0
connection.llmnr=0

[main]
hostname-mode=none
dns=systemd-resolved

[connectivity]
# Connectivity checks contact a fixed server and reveal the OS
enabled=false
