# Encrypted DNS in normal mode (Quad9: no logging of IPs, malware blocking).
# In vpn mode the tunnel's DNS server is used instead (set per-link by kratos).
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net
FallbackDNS=
DNSOverTLS=yes
DNSSEC=allow-downgrade
LLMNR=no
MulticastDNS=no
Cache=yes
