# usbguard enumerates the USB bus by reading /sys/bus/usb/devices at startup.
# On a machine with no USB controller at all (e.g. a minimal VM) that path does
# not exist, usbguard-daemon exits 1/FAILURE on every start, and systemd
# crash-loops it until "start request repeated too quickly" (observed on a
# live KratosOS install in VirtualBox with no USB controller).
#
# There is nothing for usbguard to protect without a USB bus, so only start the
# daemon when one is present. The unit then shows a clean "condition failed"
# (skipped) instead of a failed, crash-looping service. Real hardware always has
# a USB bus, so this is a no-op there; the moment a USB controller exists the
# daemon runs normally and enforces the policy.
[Unit]
ConditionPathExists=/sys/bus/usb/devices
