# Finding 6: make networking a HARD dependent of the KratosOS firewall. If
# kratos-firewall.service fails to start — for any reason, including a failure
# of its minimal default-drop preload — NetworkManager must not start either,
# so a firewall initialization error results in NO networking, never ordinary
# (open) networking.
#
# Requires= pulls the firewall in and fails NM if it failed; After= orders NM
# strictly after it. kratos-firewall preloads /etc/kratos/modes/offline.nft
# (lo-only default-drop) before the full ruleset, so the only state NM can ever
# come up on top of is either the full policy or a closed default-drop.
[Unit]
Requires=kratos-firewall.service
After=kratos-firewall.service
