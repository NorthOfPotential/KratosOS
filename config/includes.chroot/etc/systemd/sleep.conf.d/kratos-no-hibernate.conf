# KratosOS: never hibernate. Hibernation writes the entire contents of RAM
# (including disk-encryption keys and open documents) to swap, which defeats the
# anti-forensics model, and the installer's encrypted swap cannot be used as a
# resume device anyway. Plain suspend-to-RAM is unaffected.
[Sleep]
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
