# KratosOS kernel hardening (installed system). See build.sh for details.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1 slab_nomerge pti=on randomize_kstack_offset=on vsyscall=none debugfs=off ipv6.disable=1 intel_iommu=on amd_iommu=force_isolation iommu.strict=1 apparmor=1 security=apparmor"

# ── Branding: the installed-system boot menu says KratosOS, in hacker green ──
# GRUB_DISTRIBUTOR names the menu entries ("KratosOS GNU/Linux"). The colour
# pairs are "foreground/background"; green-on-black with an inverted highlight
# gives the terminal/hacker look without a full theme (so it can't fail to
# render).
GRUB_DISTRIBUTOR="KratosOS"
GRUB_COLOR_NORMAL="green/black"
GRUB_COLOR_HIGHLIGHT="black/green"
