# KratosOS: overrides /usr/lib/tmpfiles.d/systemd-resolve.conf (same name).
#
# The vendor rule is "L! /etc/resolv.conf -> stub", and a plain "L" never
# replaces an existing file. live-build leaves /etc/resolv.conf in the image as
# an EMPTY regular file, which Calamares copies to the installed system, so the
# symlink was never created (VM install test): anything that reads
# /etc/resolv.conf directly - Flatpak apps get the host's copy - had no
# nameserver at all. "L+" replaces whatever is there, at every boot, so all
# lookups go through systemd-resolved (Quad9 over authenticated DoT).
L+! /etc/resolv.conf - - - - ../run/systemd/resolve/stub-resolv.conf
