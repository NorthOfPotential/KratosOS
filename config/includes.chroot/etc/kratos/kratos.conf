# KratosOS configuration. This file is PARSED AS DATA by the kratos tool (a
# strict KEY=value reader), NOT sourced as bash — do not "simplify" it back to
# `source /etc/kratos/kratos.conf`, which would let a config edit run arbitrary
# commands as root.

# ── Network ─────────────────────────────────────────────────
# FIRST-RUN network mode: normal | vpn | offline. On the FIRST boot where no
# mode is stored yet (a fresh install, or the live ISO's ephemeral overlay),
# kratos-firewall.service latches this validated value into the persisted mode
# (/var/lib/kratos/mode). It is NOT baked into the image, so editing it on an
# installed system and rebooting BEFORE a mode has been persisted takes effect;
# once a mode is persisted it also stays the fallback if that file goes
# missing/invalid. The mode PERSISTS across shutdowns thereafter — change it at
# runtime with `kratos mode <mode>`, which is what sticks from then on. Set this
# to vpn if the machine must never boot onto clearnet (with no VPN config yet,
# boot stays fully offline, fail-closed, until you import one).
DEFAULT_MODE=normal

# ── Stealth Mode ────────────────────────────────────────────
# Refuse to start Stealth Mode unless the VPN kill switch is active.
# yes = you -> VPN -> Tor (your ISP sees only the VPN; the VPN sees only Tor)
# no  = you -> Tor      (your ISP can see that you use Tor)
STEALTH_REQUIRE_VPN=no

# Zero-touch provisioning: on the FIRST "stealth on" (or tray toggle) with no
# vault yet, KratosOS downloads the Whonix KVM image, verifies it against the
# pinned Whonix signing key, and builds the vault automatically — so booting the
# live ISO and toggling Stealth is all that's needed, no manual setup.
STEALTH_AUTOPROVISION=yes
# Vault key handling:
#   no  (default) - amnesic: a random key is generated in RAM each boot and the
#                   vault is rebuilt fresh. Nothing persists; ideal for the live
#                   ISO. No passphrase, nothing to set up.
#   yes           - persistent: the vault is kept between boots and unlocked with
#                   a passphrase you set (for an installed system with a persona
#                   that has accounts/files). Auto-provision then prompts once.
STEALTH_VAULT_PERSIST=no
# Where to fetch Whonix from (overridable if the layout ever changes). The
# download is always signature-checked against the pinned key regardless.
STEALTH_WHONIX_BASEURL=https://download.whonix.org/libvirt/
STEALTH_WHONIX_FLAVOR=Xfce
# STEALTH_WHONIX_URL=            # pin an exact image URL to skip auto-discovery

# Keep the downloaded+verified Whonix image so an installed system doesn't
# re-fetch ~1 GB on every amnesic boot. On the live ISO the cache sits on the
# ephemeral overlay and is gone at shutdown anyway; on an installed system it
# lives inside the LUKS-encrypted root (so it is encrypted at rest, but it IS a
# persistent on-disk artifact that reveals Whonix use to anyone who unlocks the
# disk). Set to 'no' to always download fresh and keep nothing.
STEALTH_WHONIX_CACHE=yes
# A validly SIGNED image can still be an OLD one (a signature proves it is
# genuine, not that it is current). Refresh the cache when it is older than this
# many days, OR when the mirror advertises a newer version. 0 disables the
# age check (a newer-version refresh is still attempted when online).
STEALTH_WHONIX_MAX_AGE_DAYS=90

# persistent: the Workstation keeps its state between sessions (needed if the
#             persona has accounts, files, browser profile)
# disposable: the Workstation is reset to a clean image every time Stealth
#             Mode is turned off
STEALTH_WORKSTATION=persistent

# Size of the encrypted stealth vault that holds the Whonix VMs
STEALTH_VAULT_SIZE=64G

# Seconds to wait for each VM to shut down cleanly before forcing it off
STEALTH_SHUTDOWN_TIMEOUT=60

# Host lockdown applied while Stealth Mode is on
STEALTH_DISABLE_SWAP=yes        # keep VM memory out of swap
STEALTH_BLOCK_SLEEP=yes         # no suspend/hibernate (keys and VM RAM stay in memory)
STEALTH_BLOCK_BLUETOOTH=yes
STEALTH_BLOCK_CAMERA=yes        # unload webcam drivers; verify no /dev/video* remains
STEALTH_BLOCK_MIC=yes           # mute host audio capture (best-effort; persona VM has no audio device)
STEALTH_BLOCK_NEW_USB=yes       # USB devices plugged in during Stealth Mode are blocked
STEALTH_ONACCESS_SCAN=yes       # ClamAV on-access scanning of home directories
STEALTH_NEW_MAC=yes             # reconnect with a fresh random MAC before starting

# Which of the above are REQUIRED vs best-effort. A protection listed here MUST
# actually be applied or Stealth Mode refuses to start and rolls the lockdown
# back — so "Stealth started" can never silently mean a protection you asked
# for isn't really in force. Names: swap sleep bluetooth camera mic usb scan mac.
# Everything NOT listed is best-effort (a failure warns but Stealth continues).
# Default: the memory-confidentiality protections, whose failure can leak the
# vault key or VM RAM to disk. Comma-separated (no spaces).
STEALTH_REQUIRE="swap,sleep"

# VM memory (MiB)
STEALTH_GATEWAY_RAM=1024
STEALTH_WORKSTATION_RAM=4096

# ── Correlation resistance (traffic analysis) ───────────────
# READ docs/CORRELATION-RESISTANCE.md FIRST. The honest summary:
#  * Nothing here defeats a GLOBAL adversary who watches both ends of Tor.
#    That is an unsolved problem for low-latency networks.
#  * Custom traffic shaping only helps against a LOCAL observer (your ISP),
#    and if it is unusual it becomes its OWN fingerprint. So it is OFF by
#    default, and the default posture is to BLEND with the Tor/Whonix crowd.

# Persona network path:
#   tor    - Tor, with connection padding. Largest anonymity set; what everyone
#            else uses. DEFAULT.
#   mixnet - NOT IMPLEMENTED YET. Intended to route the persona through the Nym
#            mixnet, but KratosOS does not provision/route Nym into the persona,
#            so Stealth Mode will REFUSE TO START with this set (rather than
#            pretend you have mixnet protection). The workstation/nym helper is
#            experimental and not wired in.
CORR_MODE=tor

# Correlation-resistance profile applied automatically when Stealth Mode starts:
#   off      - DEFAULT. Nothing beyond Tor's own defaults (connection padding +
#              vanguards-lite, already on inside the Whonix Gateway). This is the
#              honest baseline: no host-side shaping is set up for you.
#   balanced - Also rate-limit the host uplink and add jitter, so a LOCAL observer
#              (your ISP) sees a smoother volume/timing profile on top of Tor's
#              padding. Low latency, a little slower. Honest limits: this is
#              rate-limiting + jitter, NOT constant-rate padding (no cover traffic
#              is generated unless you also enable CORR_DECOY with network mode
#              'vpn'), and it does NOT defeat a GLOBAL passive adversary.
#   max      - balanced, plus constant-rate decoy cover traffic when network mode
#              is 'vpn' and CORR_DECOY_SINK is set. Still NOT the Nym mixnet: for
#              end-to-end mixing against a global adversary set CORR_MODE=mixnet
#              (experimental, seconds of latency).
CORR_STEALTH_PROFILE=off

# Tor bridges (so even your ISP can't tell you use Tor). NOT IMPLEMENTED YET:
# KratosOS does not provision bridge lines into the Gateway, so any value other
# than 'off' makes Stealth Mode REFUSE TO START (rather than imply concealment
# you don't have). For now set bridges directly in the Gateway's torrc and
# leave this off. off | obfs4 | snowflake
CORR_BRIDGES=off

# Link shaping on the you->VPN uplink ONLY (requires network mode 'vpn').
# Masks the volume/timing your ISP sees, at the cost of bandwidth and of
# looking different from a normal VPN user. off | on
CORR_LINK_SHAPING=off
CORR_SHAPE_RATE=1mbit        # ceiling the uplink is rate-limited to while shaping
CORR_SHAPE_JITTER=15ms       # random added delay (breaks fine timing patterns)
CORR_DECOY=off               # also send constant dummy traffic to fill the pipe
CORR_DECOY_SINK=             # host:port inside the tunnel to absorb decoy packets

# ── Stylometry / timing guard (always-on in Stealth Mode) ───
# Random delay (seconds, 0 disables) added when Stealth Mode starts, so the
# moment your persona appears online isn't tightly correlated with an action
# on your real identity. Keep small; it only decorrelates session *start*.
GUARD_START_JITTER=0
# Reminder shown at Stealth start to run persona text through `kratos stylo`.
GUARD_STYLO_REMINDER=yes
