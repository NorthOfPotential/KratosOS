# KratosOS configuration (sourced by the kratos tool as bash).

# ── Network ─────────────────────────────────────────────────
# Default network mode at boot: normal | vpn | offline
DEFAULT_MODE=normal

# ── Stealth Mode ────────────────────────────────────────────
# Refuse to start Stealth Mode unless the VPN kill switch is active.
# yes = you -> VPN -> Tor (your ISP sees only the VPN; the VPN sees only Tor)
# no  = you -> Tor      (your ISP can see that you use Tor)
STEALTH_REQUIRE_VPN=no

# persistent: the Workstation keeps its state between sessions (needed if the
#             persona has accounts, files, browser profile)
# disposable: the Workstation is reset to a clean image every time Stealth
#             Mode is turned off
STEALTH_WORKSTATION=persistent

# Size of the encrypted stealth vault that holds the Whonix VMs
STEALTH_VAULT_SIZE=64G

# Seconds to wait for each VM to shut down cleanly before forcing it off
STEALTH_SHUTDOWN_TIMEOUT=60

# Host lockdown applied while Stealth Mode is on
STEALTH_DISABLE_SWAP=yes        # keep VM memory out of swap
STEALTH_BLOCK_SLEEP=yes         # no suspend/hibernate (keys and VM RAM stay in memory)
STEALTH_BLOCK_BLUETOOTH=yes
STEALTH_BLOCK_CAMERA=yes        # unload webcam driver
STEALTH_BLOCK_NEW_USB=yes       # USB devices plugged in during Stealth Mode are blocked
STEALTH_ONACCESS_SCAN=yes       # ClamAV on-access scanning of home directories
STEALTH_NEW_MAC=yes             # reconnect with a fresh random MAC before starting

# VM memory (MiB)
STEALTH_GATEWAY_RAM=1024
STEALTH_WORKSTATION_RAM=4096
