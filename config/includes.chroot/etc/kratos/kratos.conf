# KratosOS configuration (sourced by the kratos tool as bash).

# ── Network ─────────────────────────────────────────────────
# Default network mode at boot: normal | vpn | offline
DEFAULT_MODE=normal

# ── Stealth Mode ────────────────────────────────────────────
# Refuse to start Stealth Mode unless the VPN kill switch is active.
# yes = you -> VPN -> Tor (your ISP sees only the VPN; the VPN sees only Tor)
# no  = you -> Tor      (your ISP can see that you use Tor)
STEALTH_REQUIRE_VPN=no

# persistent: the Workstation keeps its state between sessions (needed if the
#             persona has accounts, files, browser profile)
# disposable: the Workstation is reset to a clean image every time Stealth
#             Mode is turned off
STEALTH_WORKSTATION=persistent

# Size of the encrypted stealth vault that holds the Whonix VMs
STEALTH_VAULT_SIZE=64G

# Seconds to wait for each VM to shut down cleanly before forcing it off
STEALTH_SHUTDOWN_TIMEOUT=60

# Host lockdown applied while Stealth Mode is on
STEALTH_DISABLE_SWAP=yes        # keep VM memory out of swap
STEALTH_BLOCK_SLEEP=yes         # no suspend/hibernate (keys and VM RAM stay in memory)
STEALTH_BLOCK_BLUETOOTH=yes
STEALTH_BLOCK_CAMERA=yes        # unload webcam driver
STEALTH_BLOCK_NEW_USB=yes       # USB devices plugged in during Stealth Mode are blocked
STEALTH_ONACCESS_SCAN=yes       # ClamAV on-access scanning of home directories
STEALTH_NEW_MAC=yes             # reconnect with a fresh random MAC before starting

# Which of the above are REQUIRED vs best-effort. A protection listed here MUST
# actually be applied or Stealth Mode refuses to start and rolls the lockdown
# back — so "Stealth started" can never silently mean a protection you asked
# for isn't really in force. Names: swap sleep bluetooth camera usb scan mac.
# Everything NOT listed is best-effort (a failure warns but Stealth continues).
# Default: the memory-confidentiality protections, whose failure can leak the
# vault key or VM RAM to disk. Comma-separated (no spaces).
STEALTH_REQUIRE="swap,sleep"

# VM memory (MiB)
STEALTH_GATEWAY_RAM=1024
STEALTH_WORKSTATION_RAM=4096

# ── Correlation resistance (traffic analysis) ───────────────
# READ docs/CORRELATION-RESISTANCE.md FIRST. The honest summary:
#  * Nothing here defeats a GLOBAL adversary who watches both ends of Tor.
#    That is an unsolved problem for low-latency networks.
#  * Custom traffic shaping only helps against a LOCAL observer (your ISP),
#    and if it is unusual it becomes its OWN fingerprint. So it is OFF by
#    default, and the default posture is to BLEND with the Tor/Whonix crowd.

# Persona network path:
#   tor    - Tor, with connection padding and (optionally) bridges. Largest
#            anonymity set; what everyone else uses. DEFAULT.
#   mixnet - route the persona through the Nym mixnet (Loopix-style constant
#            cover traffic + random per-message delay). The only option here
#            with a real story against a global adversary, at a big latency
#            cost. EXPERIMENTAL: needs nym packages in the Workstation.
CORR_MODE=tor

# Use Tor bridges so even your ISP can't tell you use Tor. Set the bridge
# lines in the Gateway's torrc. obfs4 | snowflake | off
CORR_BRIDGES=off

# Link shaping on the you->VPN uplink ONLY (requires network mode 'vpn').
# Masks the volume/timing your ISP sees, at the cost of bandwidth and of
# looking different from a normal VPN user. off | on
CORR_LINK_SHAPING=off
CORR_SHAPE_RATE=1mbit        # constant sustained rate while shaping is on
CORR_SHAPE_JITTER=15ms       # random added delay (breaks fine timing patterns)
CORR_DECOY=off               # also send constant dummy traffic to fill the pipe
CORR_DECOY_SINK=             # host:port inside the tunnel to absorb decoy packets

# ── Stylometry / timing guard (always-on in Stealth Mode) ───
# Random delay (seconds, 0 disables) added when Stealth Mode starts, so the
# moment your persona appears online isn't tightly correlated with an action
# on your real identity. Keep small; it only decorrelates session *start*.
GUARD_START_JITTER=0
# Reminder shown at Stealth start to run persona text through `kratos stylo`.
GUARD_STYLO_REMINDER=yes
