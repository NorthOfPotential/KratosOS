name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege by default: the workflow's token can only read the repo.
# Jobs that need more (the ISO build signs provenance) raise it for themselves.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to a full commit SHA (not a movable tag)
      # so a compromised or re-pointed tag can't inject code into our pipeline.
      # The trailing comment records the human-readable version each SHA is.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck nftables qemu-utils python3
      - name: Create test users for the isolation attack suite
        run: |
          sudo groupadd -r kstealth || true
          sudo useradd -r -g kstealth -s /usr/sbin/nologin kstealth || true
          sudo useradd -m mallory || true
          sudo useradd -r kratos-nym || true
      - name: Run the full suite
        run: sudo ATTACKER=mallory tests/run.sh

  build-iso:
    # Builds the installer ISO so you never need a Linux machine: download it
    # from this job's Artifacts. Runs on manual dispatch and tags.
    #
    # Built inside a Debian trixie container using Debian's OWN live-build, not
    # the Ubuntu runner's (whose live-build is too old for a modern Debian
    # target and fails on suite names / index paths). Matching the tool to the
    # target is what makes the build reliable. --privileged: live-build needs
    # mount, chroot and loop devices.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    # Gate the release artifact on the security test suite: a red test job must
    # NOT yield a built, SBOM'd, provenance-attested ISO as the normal release
    # path (finding R8/CI). `needs: test` makes build-iso wait for and require a
    # green test job.
    needs: test
    runs-on: ubuntu-24.04
    # id-token + attestations let this job mint a signed, verifiable provenance
    # attestation for the ISO it builds (see the "Attest" step). contents stays
    # read — the build publishes through artifacts and attestations, not pushes.
    permissions:
      contents: read
      id-token: write
      attestations: write
    container:
      # Pinned to the trixie image digest, not the floating tag, so the build
      # base can't change under us without a visible edit here.
      image: debian:trixie@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
      options: --privileged
    steps:
      - name: Install build tooling
        run: |
          apt-get update
          # git for checkout; live-build + the image tools it drives.
          apt-get install -y --no-install-recommends \
            live-build debootstrap git ca-certificates xorriso \
            squashfs-tools dosfstools mtools
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build ISO
        run: ./build.sh          # already root in the container; no sudo
      - name: Checksums
        run: sha256sum kratosos-*.iso | tee SHA256SUMS
      - name: Record build info
        # A verifiable record of WHAT produced this ISO: source revision, the
        # pinned base-image digest, kernel version, and the package-manifest
        # hash. Lets a downloader tie the ISO to a known source commit + inputs.
        run: |
          {
            echo "source_repo:     ${{ github.repository }}"
            echo "source_revision: ${{ github.sha }}"
            echo "workflow_run:    ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo "base_image:      debian:trixie@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5"
            echo "built_at_utc:    $(date -u +%FT%TZ)"
            echo "kernel:          $(basename "$(ls ./chroot/boot/vmlinuz-* 2>/dev/null | head -1)" 2>/dev/null | sed 's/vmlinuz-//')"
            echo "live_build:      $(dpkg-query -W -f='${Version}' live-build 2>/dev/null)"
            [ -f kratosos-amd64.packages ] && echo "packages_sha256: $(sha256sum kratosos-amd64.packages | cut -d' ' -f1)"
          } | tee kratosos-build-info.txt
      - name: Generate SBOM
        # Software Bill of Materials for the built image. syft reads the live
        # root filesystem live-build leaves in ./chroot (a real dpkg database),
        # so the SBOM lists every package + version that actually shipped.
        # Best-effort: never fail the build over the SBOM itself. Runs BEFORE the
        # SUID gate so the metadata artifact still carries it if the gate fails.
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./chroot
          format: spdx-json
          output-file: kratosos.spdx.json
          upload-artifact: false
      - name: Privileged-binary inventory (SUID/SGID + capabilities) — RELEASE GATE
        # Finding 46 / P2: inventory every setuid/setgid binary and capability
        # holder in the built image and compare to tests/suid-allowlist.txt. This
        # is now a HARD GATE: an unexpected privileged binary (not on the
        # reviewed allowlist) FAILS the build, so an unreviewed root-capable
        # binary never ships in a release. The inventory file is written even on
        # failure (suid-audit prints it before exiting), and the release-metadata
        # artifact is uploaded with if: always(), so a block is fully diagnosable
        # without downloading the ISO: read the UNEXPECTED paths, then either drop
        # the package or add the path to tests/suid-allowlist.txt.
        run: |
          apt-get install -y --no-install-recommends libcap2-bin >/dev/null 2>&1 || true
          tests/suid-audit.sh ./chroot | tee kratosos-suid-inventory.txt
      - name: Attest build provenance
        # A signed, cryptographically verifiable record of WHERE and HOW the ISO
        # was built (this repo, this workflow, this commit). Downloaders verify
        # with:  gh attestation verify kratosos-amd64.hybrid.iso -R <owner>/<repo>
        # Only runs for first-party builds (a token with id-token on a fork PR
        # can't sign), so it never blocks external contributors' CI.
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: kratosos-*.iso
      - name: Upload release metadata
        # Small, always-published so the SUID gate (and the build inputs) can be
        # reviewed without pulling the multi-GB ISO — including when the gate
        # FAILS the build.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kratosos-release-metadata
          path: |
            SHA256SUMS
            kratosos-build-info.txt
            kratosos-amd64.packages
            kratosos.spdx.json
            kratosos-suid-inventory.txt
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload ISO
        # Only on a clean build: a release that failed the SUID gate must NOT
        # yield a downloadable ISO.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kratosos-iso
          path: |
            kratosos-*.iso
            SHA256SUMS
            kratosos-build-info.txt
            kratosos-amd64.packages
            kratosos.spdx.json
            kratosos-suid-inventory.txt
          retention-days: 14
